name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Type check & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (from lockfile)
        run: npm ci

      - name: Type check & build
        run: npm run build
